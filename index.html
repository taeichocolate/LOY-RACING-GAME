/* Part 2: Krathong workshop */
.workshop{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;text-align:left}
.previewStage{min-height:300px;border-radius:20px;border:1px solid #8adfff66;background:radial-gradient(ellipse at 50% 70%,#1765a9aa,#071b42 62%,#06132d);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 0 35px #35baff22}

.krathongGlow{position:absolute;bottom:18px;width:85%;height:28px;border-radius:50%;background:var(--glow);opacity:.5;filter:blur(15px)}
.krathongLeaves{position:absolute;bottom:35px;width:92%;height:78px;border-radius:50% 50% 40% 40%;background:linear-gradient(180deg,#6bd35d,#125d39 80%);border:4px solid #b5ef77;box-shadow:inset 0 -10px 0 #083e2c,0 8px 15px #0008}
.petal{position:absolute;bottom:65px;width:50px;height:115px;border-radius:90% 90% 35% 35%;background:linear-gradient(90deg,color-mix(in srgb,var(--flower),#6a1b78 24%),var(--flower) 48%,#fff3 53%,var(--flower));transform-origin:50% 100%;border:1px solid #fff8;box-shadow:inset 0 -8px 10px #0003}
.petal.p1{transform:rotate(-58deg) scale(.78);left:27px}.petal.p2{transform:rotate(-32deg) scale(.95);left:57px}.petal.p3{transform:rotate(-10deg);left:91px}.petal.p4{transform:rotate(10deg);right:91px}.petal.p5{transform:rotate(32deg) scale(.95);right:57px}.petal.p6{transform:rotate(58deg) scale(.78);right:27px}
.petal.center{width:48px;height:120px;bottom:68px;left:calc(50% - 24px);transform:rotate(0deg) scale(.9);filter:brightness(1.2)}
.candle{position:absolute;bottom:123px;left:calc(50% - 7px);width:14px;height:55px;border-radius:5px;background:linear-gradient(90deg,#9a4b14,#ffe4a0,#b76a24);box-shadow:0 0 12px var(--candle)}

@keyframes flicker{to{transform:rotate(38deg) scale(.9);filter:drop-shadow(0 0 18px var(--fire))}}

<script>

 function startHomeMusic(){const a=$('homeMusic');if(a){a.volume=.5;if(a.paused){const p=a.play();if(p&&p.catch)p.catch(()=>{})}}if(!homeFireworkTimer){playHomeFirework();homeFireworkTimer=setInterval(playHomeFirework,8500)}}
 function stopHomeMusic(){const a=$('homeMusic');if(a){a.pause();try{a.currentTime=0}catch(e){}}if(homeFireworkTimer){clearInterval(homeFireworkTimer);homeFireworkTimer=null}}

 function clearRanks(){const pin=prompt('กรอกรหัสผู้ดูแลเพื่อจัดการอันดับ');if(pin===null)return;if(pin!=='11110000'){alert('รหัสผู้ดูแลไม่ถูกต้อง');return}if(!confirm('ผู้ดูแลต้องการล้างคะแนนอันดับทั้งหมดใช่ไหม?'))return;ranks=[];try{localStorage.setItem(KEY,'[]');localStorage.setItem('loyracing_ranks','[]')}catch(e){}renderRanks();const modalList=$('modal').querySelector('.rankList');if(modalList)modalList.innerHTML='<div class="emptyRank">ยังไม่มีคะแนน</div>';toast('ล้างอันดับคะแนนแล้ว')}

 function toast(msg){

 const customColors={flower:'#ed42c8',candle:'#ffd66b',fire:'#ff9b27'};
 const krathongSprite="asset-5dcaa24d8f6e.png";
 const krathongAtlas=new Image();
 function drawKrathongCanvas(canvas,index){if(!canvas||!krathongAtlas.complete||!krathongAtlas.naturalWidth)return;const ctx=canvas.getContext('2d'),w=krathongAtlas.naturalWidth/3,h=krathongAtlas.naturalHeight/3;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(krathongAtlas,(index%3)*w,Math.floor(index/3)*h,w,h,0,0,canvas.width,canvas.height)}
 function renderKrathongCanvases(root=document){root.querySelectorAll('canvas[data-krathong]').forEach(c=>drawKrathongCanvas(c,Number(c.dataset.krathong)||0))}
 krathongAtlas.onload=()=>renderKrathongCanvases();krathongAtlas.src=krathongSprite;

  flower:['#ed42c8','#ff526f','#ff9b35','#ffd34f','#79d85b','#37d7e8','#537cff','#a76aff','#ffffff'],

  fire:['#ff9b27','#fff06a','#4ceaff','#ff4c9a','#8d75ff','#7dff9b']
 };
 const skinSpriteIndices=[1,2,3,4,5,6,7,0];
 function spritePosition(i){return ((i%3)*50)+'% '+(Math.floor(i/3)*50)+'%'}
 function flowerSpriteIndex(color){const i=palettes.flower.indexOf(color);return i<0?0:i}

 }

  const last=passed&&currentStage===5&&!singleStageMode,stage=stageScenes[currentStage-1];const title=last?'🏆 พิชิตครบทั้ง 5 ด่าน!':passed?'🏆 ผ่านด่านสำเร็จ!':'💸 เงินหมด พลาดด่าน!';
  const gradeColor=grade==='S'?'#ffe36e':grade==='A'?'#83e8ff':'#d5b6ff';
  showModal(`<div class="stageResult">
   <style>
    .stageResult{color:#fff;text-align:center;padding:8px 2px}
    .resultBanner{font-size:clamp(24px,5vw,36px);font-weight:1000;color:#ffe58d;text-shadow:0 0 16px #ff8b36;margin:6px 0 14px}
    .gradeMark{font-size:clamp(72px,18vw,112px);line-height:1;font-weight:1000;color:${gradeColor};text-shadow:0 0 12px ${gradeColor},0 0 34px #7e56ff;margin:10px 0}
    .resultStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
    .resultStat{background:#091d3b;border:1px solid #4775a2;border-radius:13px;padding:12px 5px}
    .resultStat strong{display:block;font-size:clamp(19px,4vw,27px);color:#fff}
    .resultStat small{font-size:11px;color:#a9c9e9}
    .resultNote{font-size:13px;color:#c6def7;margin:8px 0 14px}
    .resultButtons{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
   </style>
   <div class="resultBanner">${title}</div>
   <div style="font-size:54px">${stage.icon}</div>
   <div>ด่าน ${currentStage}/5 ${stage.name} ${passed?'เคลียร์เรียบร้อย':'ยังไม่สำเร็จ'}</div>
   <div class="gradeMark">${grade}</div>
   <div style="font-weight:900;color:${gradeColor}">ระดับผลงาน ${grade}</div>
   <div class="resultStats">
    <div class="resultStat"><strong>${finalScore.toLocaleString('th-TH')}</strong><small>⭐ คะแนนรวม</small></div>
    <div class="resultStat"><strong>${raceState.coins}</strong><small>🪙 เหรียญที่เก็บได้</small></div>
    <div class="resultStat"><strong>${raceState.money.toLocaleString('th-TH')} ฿</strong><small>💰 เงินคงเหลือ</small></div>
   </div>
   <p class="resultNote">${singleStageMode?(passed?'ผ่านด่านแล้ว เลือกด่านอื่นหรือเล่นซ้ำได้':'เงินหมดแล้ว เริ่มใหม่เพื่อรับเงิน 1,000 บาท'):last?'สุดยอด! พิชิตครบทุกสนามแล้ว':passed?'เงินคงเหลือนี้จะติดตัวไปยังด่านถัดไป':'เงินหมดแล้ว เริ่มใหม่เพื่อรับเงิน 1,000 บาท'}</p>
   <div class="resultButtons">
    <button class="smallBtn" id="raceHome">กลับหน้าหลัก</button>
    <button class="smallBtn" id="raceAgain">${passed?'เล่นด่านนี้อีกครั้ง':'เริ่มใหม่ 1,000 บาท'}</button>
    ${passed&&!last&&!singleStageMode?'<button class="btn primary" id="nextStage">ไปด่านต่อไป ➜</button>':''}${singleStageMode?'<button class="btn primary" id="otherStages">เลือกด่านอื่น</button>':''}${last?'<button class="btn primary" id="restartRun">เล่นใหม่ 1,000 บาท</button>':''}
   </div>
  </div>`);
  $('raceHome').onclick=()=>{leaveGameFullscreen();closeModal();document.onkeydown=null;startHomeMusic()};if(singleStageMode)$('otherStages').onclick=()=>{leaveGameFullscreen();closeModal();stageSelectScreen()};
  $('raceAgain').onclick=()=>{if(!passed){if(!singleStageMode)currentStage=1;carriedMoney=1000}else carriedMoney=stageStartMoney;closeModal();start()};
  if(passed&&!last)$('nextStage').onclick=()=>{currentStage++;closeModal();start()};if(last)$('restartRun').onclick=()=>{currentStage=1;carriedMoney=1000;closeModal();start()};
 }
 function stageSelectScreen(){const descriptions=['ผักตบชวา • เป็ด • ก้อนหิน','ทุ่น • เรือ • ผักตบชวา','ขยะ • เรือ • วัยรุ่นขโมยเหรียญ','ผี • กะโหลก • มือโผล่จากน้ำ','มอเตอร์ไซค์ • กรวย • หลุมถนน'];showModal(`<button class="close" id="closeModal">×</button><h2 id="modalTitle">เลือกด่านที่ต้องการเล่น</h2><p>เลือกสนามใดก็ได้ เริ่มต้นด้วยเงิน 1,000 บาท</p><style>.stagePickGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.stagePick{padding:0;border:1px solid #4f85b5;border-radius:15px;background:linear-gradient(145deg,#102b4c,#08172e);color:#fff;text-align:left;cursor:pointer;overflow:hidden;min-width:0;transition:transform .18s,border-color .18s,box-shadow .18s}.stagePick:hover{border-color:#ffd36b;transform:translateY(-2px);box-shadow:0 0 18px #45d8ff44}.stagePreview{display:block;width:100%;height:clamp(86px,12vw,132px);background-size:cover;background-position:center;position:relative;border-bottom:1px solid #69cfff55}.stagePreview:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,#06152be8)}.stagePickInfo{display:block;padding:9px 11px 11px}.stagePick strong{display:block;color:#ffe29a;font-size:15px;margin-bottom:4px}.stageStars{display:block;color:#ffd84d;letter-spacing:2px;font-size:14px;text-shadow:0 0 9px #ffba31;margin-bottom:4px}.stagePickInfo>span{display:block;font-size:11px;color:#c8ddf5;line-height:1.4}.stagePick:last-child:nth-child(odd){grid-column:1/-1}.stagePick:last-child:nth-child(odd) .stagePreview{height:clamp(90px,11vw,120px)}@media(max-width:520px){.stagePickGrid{grid-template-columns:1fr;gap:9px}.stagePreview{height:100px}.stagePick:last-child:nth-child(odd){grid-column:auto}.stagePick:last-child:nth-child(odd) .stagePreview{height:100px}}</style><div class="stagePickGrid">`+stageScenes.map((x,i)=>`<button class="stagePick" data-stage="${i+1}"><span class="stagePreview" style="background-image:linear-gradient(180deg,rgba(3,12,31,.04),rgba(3,12,31,.24)),url('${x.image}')"></span><span class="stagePickInfo"><strong><span class="stageStars" aria-label="ความยาก ${i+1} จาก 5">${'★'.repeat(i+1)}${'☆'.repeat(5-i-1)}</span> ${x.icon} ด่าน ${i+1} · ${x.name}</strong><span>${descriptions[i]}</span></span></button>`).join('')+`</div><div class="modalActions"><button class="smallBtn" id="closeStagePick">กลับหน้าหลัก</button></div>`);$('closeModal').onclick=closeModal;$('closeStagePick').onclick=closeModal;$('modal').querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{singleStageMode=true;currentStage=Number(b.dataset.stage);carriedMoney=1000;start()})}
 $('stageSelectBtn').addEventListener('click',stageSelectScreen);
 $('clearRanksHome').addEventListener('click',clearRanks);
 $('startBtn').addEventListener('click',()=>{singleStageMode=false;currentStage=1;carriedMoney=1000;start()});
 $('selectBtn').addEventListener('click',customizeScreen);
 $('howBtn').addEventListener('click',howScreen);
 $('rankBtn').addEventListener('click',rankScreen);
 $('modalWrap').addEventListener('click',e=>{if(e.target===$('modalWrap'))closeModal()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(raceState)raceState.running=false;stopRace();stopRaceMusic();document.onkeydown=null;document.onkeyup=null;leaveGameFullscreen();closeModal();startHomeMusic()}});
 renderRanks();
})();
</script>
